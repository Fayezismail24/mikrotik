<svg xmlns="http://www.w3.org/2000/svg" width="680" height="510" viewBox="0 0 680 510" role="img" aria-labelledby="title desc">
  <title id="title">Lab 1 topology: DHCP server, bridge and NAT</title>
  <desc id="desc">Home router 192.168.1.1 connects through EVE-NG Cloud0 (pnet0) to R1 ether1 192.168.1.133/24 as DHCP client. R1 does srcnat masquerade out ether1. R1 bridge1 192.168.2.1/24 runs DHCP server1 with pool 192.168.2.2-.10 and joins ether2-ether5, where VPC1-VPC4 get 192.168.2.x/24 by DHCP.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h { font-size: 14px; font-weight: 600; }
    .s { font-size: 12px; }
    .lbl { fill: #5F5E5A; }
    .wire { stroke: #888780; stroke-width: 1; fill: none; }
    .gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
    .gray .h { fill: #444441; }
    .gray .s { fill: #5F5E5A; }
    .purple rect { fill: #EEEDFE; stroke: #534AB7; }
    .purple .h { fill: #3C3489; }
    .purple .s { fill: #534AB7; }
    .teal rect { fill: #E1F5EE; stroke: #0F6E56; }
    .teal .h { fill: #085041; }
    .teal .s { fill: #0F6E56; }
    @media (prefers-color-scheme: dark) {
      .lbl { fill: #D3D1C7; }
      .wire { stroke: #B4B2A9; }
      .gray rect { fill: #444441; stroke: #B4B2A9; }
      .gray .h { fill: #F1EFE8; }
      .gray .s { fill: #D3D1C7; }
      .purple rect { fill: #3C3489; stroke: #AFA9EC; }
      .purple .h { fill: #EEEDFE; }
      .purple .s { fill: #CECBF6; }
      .teal rect { fill: #085041; stroke: #5DCAA5; }
      .teal .h { fill: #9FE1CB; }
      .teal .s { fill: #5DCAA5; }
    }
  </style>

  <!-- Home router -->
  <g class="gray"><rect x="230" y="30" width="220" height="56" rx="8" stroke-width="0.8"/>
    <text class="h" x="340" y="53" text-anchor="middle">Home router</text>
    <text class="s" x="340" y="73" text-anchor="middle">192.168.1.1 · real LAN</text></g>
  <line class="wire" x1="340" y1="86" x2="340" y2="120"/>
  <text class="s lbl" x="352" y="107">192.168.1.0/24</text>

  <!-- Cloud0 -->
  <g class="gray"><rect x="230" y="120" width="220" height="56" rx="8" stroke-width="0.8" stroke-dasharray="4 3"/>
    <text class="h" x="340" y="143" text-anchor="middle">Cloud0 / pnet0</text>
    <text class="s" x="340" y="163" text-anchor="middle">EVE-NG bridge to home</text></g>
  <line class="wire" x1="340" y1="176" x2="340" y2="210"/>
  <text class="s lbl" x="352" y="197">ether1 · 192.168.1.133/24 · DHCP client</text>

  <!-- R1 -->
  <g class="purple"><rect x="230" y="210" width="220" height="56" rx="8" stroke-width="0.8"/>
    <text class="h" x="340" y="233" text-anchor="middle">R1 (CHR 7.24.5)</text>
    <text class="s" x="340" y="253" text-anchor="middle">srcnat masquerade out ether1</text></g>
  <line class="wire" x1="340" y1="266" x2="340" y2="300"/>

  <!-- bridge1 / LAN -->
  <g class="teal"><rect x="40" y="300" width="600" height="180" rx="20" stroke-width="0.8"/>
    <text class="h" x="340" y="331" text-anchor="middle">bridge1 · 192.168.2.1/24</text>
    <text class="s" x="340" y="351" text-anchor="middle">DHCP server1 · pool 192.168.2.2–.10 · gw .2.1</text>
    <text class="s" x="340" y="470" text-anchor="middle">Each VPC gets 192.168.2.x/24 by DHCP</text></g>

  <line class="wire" x1="125" y1="362" x2="125" y2="388" marker-end="url(#arrow)"/>
  <line class="wire" x1="270" y1="362" x2="270" y2="388" marker-end="url(#arrow)"/>
  <line class="wire" x1="415" y1="362" x2="415" y2="388" marker-end="url(#arrow)"/>
  <line class="wire" x1="560" y1="362" x2="560" y2="388" marker-end="url(#arrow)"/>

  <g class="gray">
    <rect x="60" y="390" width="130" height="56" rx="8" stroke-width="0.8"/>
    <text class="h" x="125" y="413" text-anchor="middle">VPC1</text><text class="s" x="125" y="433" text-anchor="middle">ether2</text>
    <rect x="205" y="390" width="130" height="56" rx="8" stroke-width="0.8"/>
    <text class="h" x="270" y="413" text-anchor="middle">VPC2</text><text class="s" x="270" y="433" text-anchor="middle">ether3</text>
    <rect x="350" y="390" width="130" height="56" rx="8" stroke-width="0.8"/>
    <text class="h" x="415" y="413" text-anchor="middle">VPC3</text><text class="s" x="415" y="433" text-anchor="middle">ether4</text>
    <rect x="495" y="390" width="130" height="56" rx="8" stroke-width="0.8"/>
    <text class="h" x="560" y="413" text-anchor="middle">VPC4</text><text class="s" x="560" y="433" text-anchor="middle">ether5</text>
  </g>
</svg>
